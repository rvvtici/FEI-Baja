services:
  postgres:
    image: postgres:15
    container_name: feibaja_db
    environment:
      POSTGRES_DB: feibaja_db
      POSTGRES_USER: feibaja
      POSTGRES_PASSWORD: feibaja
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feibaja"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
